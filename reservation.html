<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>☕</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Plus Jakarta Sans', sans-serif; } </style>
</head>
<body class="bg-[#0F0E0C] text-[#E8E4DF]">

    <header class="fixed w-full top-0 z-50 bg-[#0F0E0C]/90 backdrop-blur-md border-b border-white/5">
        <div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold font-serif-custom text-white">AURA<span class="text-[#C89B67]">.</span></a>
            <nav class="flex gap-6 text-xs tracking-widest uppercase font-semibold text-neutral-400">
                <a href="index.html" class="hover:text-[#C89B67]">Home</a>
                <a href="menu.html" class="hover:text-[#C89B67]">Menu</a>
                <a href="reservation.html" class="text-[#C89B67]">Bookings</a>
            </nav>
        </div>
    </header>

    <div class="pt-32 pb-20 px-6 min-h-screen flex items-center justify-center">
        <div class="max-w-xl w-full bg-[#181714] p-8 md:p-10 rounded-2xl border border-white/10 shadow-2xl">
            <div class="text-center mb-8">
                <span class="text-[#C89B67] text-xs font-bold uppercase tracking-widest">Instant Confirmation</span>
                <h1 class="text-3xl font-bold text-white font-serif-custom mt-1">Reserve A Table</h1>
            </div>

            <form onsubmit="handleBooking(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-neutral-300 mb-1">Full Name</label>
                    <input type="text" id="cust_name" required class="w-full bg-[#0F0E0C] border border-white/10 rounded-lg px-4 py-3 text-white text-sm focus:outline-none focus:border-[#C89B67]">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-neutral-300 mb-1">Date</label>
                        <input type="date" id="cust_date" required class="w-full bg-[#0F0E0C] border border-white/10 rounded-lg px-4 py-3 text-white text-sm focus:outline-none focus:border-[#C89B67]">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-neutral-300 mb-1">Time</label>
                        <input type="time" id="cust_time" required class="w-full bg-[#0F0E0C] border border-white/10 rounded-lg px-4 py-3 text-white text-sm focus:outline-none focus:border-[#C89B67]">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-neutral-300 mb-1">Number of Guests</label>
                    <select id="cust_guests" class="w-full bg-[#0F0E0C] border border-white/10 rounded-lg px-4 py-3 text-white text-sm focus:outline-none focus:border-[#C89B67]">
                        <option value="2 Guests">2 Guests</option>
                        <option value="4 Guests">4 Guests</option>
                        <option value="6+ VIP Table">6+ Guests (VIP Table)</option>
                    </select>
                </div>

                <button type="submit" class="w-full bg-[#C89B67] hover:bg-[#b08452] text-black font-bold text-xs uppercase tracking-widest py-4 rounded-lg transition-all flex items-center justify-center gap-2 mt-4">
                    <i class="fa-brands fa-whatsapp text-base"></i> Confirm via WhatsApp 
                </button>
            </form>
        </div>
    </div>

    <script>
        function handleBooking(e) {
            e.preventDefault();
            const name = document.getElementById('cust_name').value;
            const date = document.getElementById('cust_date').value;
            const time = document.getElementById('cust_time').value;
            const guests = document.getElementById('cust_guests').value;

            const text = `*New Reservation Request - AURA Coffee & Bistro*%0A%0A` +
                         `👤 *Name:* ${encodeURIComponent(name)}%0A` +
                         `📅 *Date:* ${date}%0A` +
                         `⏰ *Time:* ${time}%0A` +
                         `👥 *Party Size:* ${encodeURIComponent(guests)}`;

            window.open(`https://wa.me/201025134834?text=${text}`, '_blank');
        }
    </script>
</body>
</html>
